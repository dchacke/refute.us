            .data(flowLinks, function (d) { return d.source.id + ">" + d.target.id; })
            .join("path")
            .attr("class", "link-flow");

          versionSel = versionLayer.selectAll("path")
            .data(versionLinks, function (d) { return d.source.id + "~" + d.target.id; })
            .join("path")
            .attr("class", "version-link");

          nodeSel = nodeLayer.selectAll("g.node")
            .data(nodes, function (d) { return d.id; })
            .join(function (enter) {
              var g = enter.append("g")
                .attr("class", "node")
                .attr("tabindex", 0)
                .attr("role", "img");
              g.append("circle").attr("class", "core");
              g.append("text");
              g.append("text").attr("class", "preview");
              g.call(drag)
                .on("pointerenter", function (e, d) {
                  this.classList.add("is-highlighted");
                  showTip(d);
                  placeTip(e.clientX, e.clientY);
                })
                .on("pointermove", function (e) { placeTip(e.clientX, e.clientY); })
                .on("pointerleave", function () {
                  this.classList.remove("is-highlighted");
                  hideTip();
                })
                .on("focus", function (e, d) {
                  if (interactions.suppressNodeFocusTip) return;
                  this.classList.add("is-highlighted");
                  showTip(d);
                  var b = this.getBoundingClientRect();
                  placeTip(b.right, b.top);
                })
                .on("blur", function () {
                  this.classList.remove("is-highlighted");
                  hideTip();
                });
              // Tapping a node opens the menu of what you can do with it.
              addPress(g, {
                onTap: function (e, d) {
                  if (interactions.onNodeTap) interactions.onNodeTap(e, d);
                }
              });
              return g;
            });
          // Nodes for deleted ideas are dropped by join's default exit handling.

          nodeSel
            .classed("is-root", function (d) { return d.depth === 0; })
            .classed("is-adoptable", function (d) { return d.adoptable; })
            .attr("aria-label", function (d) {
              return "Idea: " + d.text + ". " + statusText(d) + ". Activate to add a criticism.";
            });
          nodeSel.select("circle.core").attr("r", radius);
          // Only root ideas carry a label on the canvas now, centered above the node.
          nodeSel.select("text")
            .attr("text-anchor", "middle")
            .attr("x", 0)
            .attr("y", function (d) { return -(radius(d) + 11); })
            .attr("dy", "0")
            .call(renderLabel);
          // A short preview of each criticism's own text, underneath its node.
          nodeSel.select("text.preview")
            .attr("x", 0)
            .attr("y", function (d) { return radius(d) + 7.5; })
            .attr("dy", "0.8em")
            .text(function (d) {
              return d.depth === 0 ? "" : preview(d.text, 16);
            });

          // The very first idea (or the first one after a reset) should always
          // land nicely in view -- any pan/zoom that happened while the canvas
          // was still empty didn't matter yet, so it shouldn't block this fit.
          if (nodes.length > 0 && wasEmpty) userMoved = false;
          wasEmpty = nodes.length === 0;

          reheat(0.7);
          fit(true);
        }

        return {
          update: update,
          fit: function () { userMoved = false; fit(true); },
          // A tap's position in canvas coordinates (accounting for pan/zoom).
          canvasPoint: function (e) {
            return (e && typeof e.clientX === "number") ? d3.pointer(e, viewport.node()) : null;
          },
          placeNewRoot: placeNewRoot,
          // The rows as currently shown, for saving with a new point in history.
          shownRows: function () {
            return { rowOf: rowOf, manual: shownManual, w: width, h: height };
          }
        };
      })();

      /* ---------- storage ---------- */
      // Accepts the older formats (plain strings, or objects without ids) as well as the current one.
      function normalize(x) {
        if (typeof x === "string") return { id: uid(), text: x, children: [] };
        if (x && typeof x.text === "string") {
          var kids = Array.isArray(x.children) ? x.children.map(normalize).filter(Boolean) : [];
          var idea = { id: (typeof x.id === "string" && x.id) ? x.id : uid(), text: x.text, children: kids };
          if (typeof x.row === "number") idea.row = x.row;
          return idea;
        }
        return null;
      }

      // What's saved under HISTORY_KEY is wrapped in a versioned envelope --
      // { version, state } -- so the shape of `state` can keep changing
      // (a rename, a new field, whatever) without ever touching how the
      // envelope itself is read. Data saved before this system existed has
      // no envelope at all (just the old { history, cursor } shape directly);
      // that's treated as version 0.
      var CURRENT_VERSION = 3;

      // Each migration takes the previous version's `state` and returns the
      // next version's `state`. Once shipped, a migration is never edited --
      // only new ones get added on top, same as a database migration.
      var MIGRATIONS = {
        1: function (state) {
          // Version 0 was unversioned: `state` here is whatever was stored
          // directly under HISTORY_KEY before the envelope existed.
          var history = (state && Array.isArray(state.history)) ? state.history : [];
          var cursor = (state && typeof state.cursor === "number") ? state.cursor : 0;
          return { history: history, cursor: cursor };
        },
        2: function (state) {
          // Adds `ui`, for the handful of view preferences worth remembering.
          state = state || {};
          return { history: state.history || [], cursor: state.cursor || 0, ui: { legendOpen: true } };
        },
        3: function (state) {
          // Snapshots were nested trees, which can't express one criticism
          // belonging to two ideas; they're now flat ideas plus the edges
          // between them (see ideasToGraph).
          state = state || {};
          var history = (Array.isArray(state.history) ? state.history : []).map(function (entry) {
            var nested = Array.isArray(entry && entry.snapshot) ? entry.snapshot.map(normalize).filter(Boolean) : [];
            entry = entry || {};
            return {
              snapshot: ideasToGraph(nested),
              type: entry.type, detail: entry.detail, summary: entry.summary,
              time: entry.time, rows: entry.rows
            };
          });
          return { history: history, cursor: state.cursor || 0, ui: state.ui || { legendOpen: true } };
        }
      };

      // Brings whatever was parsed from storage up to CURRENT_VERSION,
      // running each migration in order. `raw` is the parsed JSON as-is
      // (or null if nothing was stored).
      function migrateStoredState(raw) {
        var hasEnvelope = !!(raw && typeof raw.version === "number");
        var version = hasEnvelope ? raw.version : 0;
        var state = hasEnvelope ? raw.state : raw;
        // Data written by a newer version of this page (a stale tab, or a
        // rollback to an older build) can't be read backwards -- say so and
        // leave it alone, rather than reading it as though it were current
        // and saving over it in the older shape. Going forward again is a new
        // migration, never a downgrade.
        if (version > CURRENT_VERSION) throw new Error("Saved data is from a newer version of this page");
        while (version < CURRENT_VERSION) {
          version += 1;
          var migrate = MIGRATIONS[version];
          if (typeof migrate !== "function") throw new Error("Missing migration to version " + version);
          state = migrate(state);
        }
        return { version: version, state: state };
      }

      // The full history of every add, as tree snapshots. `cursor` is whichever
      // point in that history the page currently shows.
      var history = [];
      var cursor = -1;

      function loadHistory() {
        try {
          var raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || "null");
          var state = migrateStoredState(raw).state;
          if (state && state.ui && typeof state.ui.legendOpen === "boolean") ui.legendOpen = state.ui.legendOpen;
          if (state && Array.isArray(state.history) && state.history.length) {
            history = state.history.map(function (e) {
              return {
                snapshot: readGraph(e.snapshot),
                type: typeof e.type === "string" ? e.type : "add",
                // Newer entries carry `detail` -- a few plain keywords/values
                // the display text is generated from at render time (see
                // summaryFor), so wording can change later without a
                // migration. Older entries only have a frozen `summary`
                // string from before that existed; summaryFor() falls back
                // to it when `detail` is missing.
                detail: (e.detail && typeof e.detail === "object") ? e.detail : null,
                summary: typeof e.summary === "string" ? e.summary : null,
                time: typeof e.time === "number" ? e.time : Date.now(),
                rows: copyRowsMeta(e.rows)
              };
            });
            cursor = Math.min(Math.max(0, state.cursor | 0), history.length - 1);
            roots = graphToIdeas(history[cursor].snapshot);
            rowsMeta = copyRowsMeta(history[cursor].rows);
            return;
          }
        } catch (err) {
          // Either a migration failed, or the saved data was corrupt in some
          // other way -- don't try to salvage it (that risks half-migrated
          // state sneaking through), just say so plainly and start fresh below.
          alert("Your saved discussion couldn't be loaded, so this page is starting fresh.");
        }

        // Migrate from the format used before the timeline existed, if present.
        var seed = [];
        try {
          var legacy = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (Array.isArray(legacy)) seed = legacy.map(normalize).filter(Boolean);
        } catch (err) {
          /* start empty */
        }

        roots = seed;
        history = [{ snapshot: ideasToGraph(seed), type: "start", detail: {}, time: Date.now() }];
        cursor = 0;
      }

      function saveHistory() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify({
            version: CURRENT_VERSION,
            state: { history: history, cursor: cursor, ui: { legendOpen: ui.legendOpen } }
          }));
        } catch (err) {
          /* storage unavailable: everything stays in memory for this visit */
        }
      }

      // Records the current tree as a new point in history. If the timeline was
      // rewound before this edit, everything after that point is dropped first --
      // editing from the past starts a new branch from there, discarding the old
      // future. `detail` is a small plain object of keywords/values (an
      // idea's text, a count, ...) that summaryFor() turns into display text
      // at render time -- see summaryFor for why.
      function recordEvent(type, detail) {
        if (cursor < history.length - 1) history.length = cursor + 1;
        history.push({ snapshot: ideasToGraph(roots), type: type, detail: detail || {}, time: Date.now(), rows: copyRowsMeta(rowsMeta) });
        cursor = history.length - 1;
        saveHistory();
        updateTimelineUI();
      }

      // Generates an entry's display text from its type and detail, rather
      // than freezing it as a string at the moment the entry is created --
      // so wording can be improved later and it applies retroactively to
      // every entry, old and new, without a migration. Entries saved before
      // this existed only have a frozen `summary`; those still show their
      // original wording.
      function summaryFor(entry) {
        var d = entry.detail || {};
        switch (entry.type) {
          case "start":
            return "Start";
          case "add-idea":
            return "Added idea “" + preview(d.text || "", 24) + "”";
          case "revise":
            return "Revised “" + preview(d.ofText || "", 20) + "” to “" + preview(d.text || "", 20) + "”";
          case "add-criticism":
            return "Submitted criticism “" + preview(d.text || "", 24) + "”";
          case "delete":
            return "Deleted “" + preview(d.text || "", 24) + "”" +
              (d.count > 0 ? " (+" + d.count + (d.count === 1 ? " criticism)" : " criticisms)") : "");
          case "reorder":
            if (!d.neighborText) return "Moved “" + preview(d.text || "", 24) + "” to a new row";
            return "Moved “" + preview(d.text || "", 20) + "” " + d.placement + " “" + preview(d.neighborText || "", 20) + "”";
          default:
            return entry.summary || "Event";
        }
      }

      /* ---------- rational adoptability ---------- */
      // A leaf is always rationally adoptable. An idea with criticisms is
      // rationally adoptable exactly when none of them are. Criticisms are
      // settled before the idea they attack, and a shared criticism is
      // settled once -- the same verdict counting for every idea it attacks.
      function evaluate(list, out) {
        (function visit(ideas) {
          ideas.forEach(function (idea) {
            if (out[idea.id] !== undefined) return;
            out[idea.id] = true;
            visit(idea.children);
            out[idea.id] = idea.children.every(function (c) { return !out[c.id]; });
          });
        })(list);
      }

      var emptyHint = document.getElementById("empty-hint");
      var HINT_FIRST = "Tap anywhere in empty space to add your first idea.";
      var HINT_SECOND = "Tap anywhere in empty space to add another idea. Tap an idea to criticize it.";

      function countIdeas(list) {
        return allIdeas(list).length;
      }

      // A one-line report of the state of the discussion right now: how many
      // of the top-level ideas currently survive their criticisms. Always
      // shown (never hidden) so the layout below it never jumps around --
      // at zero ideas it just says so, rather than disappearing.
      var reportBanner = document.getElementById("report-banner");
      var reportBannerText = document.getElementById("report-banner-text");
      function updateReportBanner(status) {
        var total = roots.length;
        var adoptable = roots.filter(function (r) { return status[r.id]; }).length;
        var text;
        if (total === 0) {
          text = "No ideas yet.";
        } else if (adoptable === total) {
          text = total === 1
            ? "The idea is rationally adoptable."
            : "All " + total + " ideas are rationally adoptable.";
        } else if (adoptable === 0) {
          text = total === 1
            ? "The idea is not rationally adoptable."
            : "None of the " + total + " ideas are rationally adoptable.";
        } else {
          text = adoptable + " of " + total + " ideas " + (adoptable === 1 ? "is" : "are") + " rationally adoptable.";
        }
        setReportText(text);
      }

      // Recomputes adoptability and redraws the chart.
      function refresh() {
        var status = {};
        evaluate(roots, status);
        forest.update(roots, status);
        var total = countIdeas(roots);
        emptyHint.hidden = total > 1;
        emptyHint.textContent = total === 1 ? HINT_SECOND : HINT_FIRST;
        updateReportBanner(status);
      }

      // Called after every change: refresh the chart, then record this as a new
      // point in the timeline (which also persists it).
      function commit(type, detail) {
        refresh();
        // The new point in history saves the rows as they're now shown, so
        // coming back to it later (at any pane size) starts from exactly this.
        var shown = forest.shownRows();
        if (shown) {
          roots.forEach(function (idea) {
            if (typeof shown.rowOf[idea.id] === "number") idea.row = shown.rowOf[idea.id];
            else delete idea.row;
          });
          rowsMeta = { manual: shown.manual, w: shown.w, h: shown.h };
        }
        recordEvent(type, detail);
      }

      // Jumps the whole page to how it looked at a given point in the timeline.
      function restoreTo(index) {
        if (index < 0 || index >= history.length) return;
        cursor = index;
        roots = graphToIdeas(history[index].snapshot);
        rowsMeta = copyRowsMeta(history[index].rows);
        refresh();
        saveHistory();
        updateTimelineUI();
      }

      /* ---------- timeline (history scrubber) ---------- */
      var timelineLabel = document.getElementById("timeline-label");
      var timelineCount = document.getElementById("timeline-count");
      var timelineSlider = document.getElementById("timeline-slider");
      var timelineTicks = document.getElementById("timeline-ticks");
      var timelineTrackWrap = document.querySelector(".timeline-track-wrap");
      var timelineHint = document.getElementById("timeline-hint");
      var timelineHintText = document.getElementById("timeline-hint-text");
      var timelineFooter = document.getElementById("timeline");

      // Time alone for today; the full date is added once it's no longer today,
      // since "04:40:37 PM" stops being enough to place an event on its own.
      function formatTime(t) {
        try {
          var d = new Date(t);
          var now = new Date();
          var sameDay = d.getFullYear() === now.getFullYear() &&
            d.getMonth() === now.getMonth() &&
            d.getDate() === now.getDate();
          var opts = { hour: "2-digit", minute: "2-digit", second: "2-digit" };
          if (!sameDay) {
            opts.year = "numeric";
            opts.month = "short";
            opts.day = "numeric";
          }
          return d.toLocaleString([], opts);
        } catch (err) {
          return "";
        }
      }

      function updateTimelineUI() {
        var n = history.length;
        timelineFooter.hidden = n <= 1;
        if (n <= 1) return;
        timelineSlider.max = String(Math.max(0, n - 1));
        timelineSlider.value = String(cursor);
        timelineSlider.disabled = n <= 1;
        timelineHint.hidden = n <= 1;
        timelineSlider.setAttribute("aria-valuetext", summaryFor(history[cursor]));
        timelineCount.textContent = (cursor + 1) + " / " + n;
        timelineLabel.textContent = summaryFor(history[cursor]);

        timelineTicks.innerHTML = "";
        history.forEach(function (entry, i) {
          var tick = document.createElement("button");
          tick.type = "button";
          tick.className = "timeline-tick" + (i === cursor ? " is-active" : "");
          // The slider's thumb is inset by half its width (20px) from each
          // edge of the track, so a tick's position has to match that same
          // inset rather than spanning the full 0-100% width.
          var frac = n <= 1 ? 0 : i / (n - 1);
          tick.style.left = "calc(" + frac + " * (100% - 20px) + 10px)";
          var text = summaryFor(entry);
          tick.title = text + " — " + formatTime(entry.time);
          tick.setAttribute("aria-label", text + ", " + formatTime(entry.time));
          tick.addEventListener("click", function () {
            if (i !== cursor) restoreTo(i);
          });
          timelineTicks.appendChild(tick);
        });
      }

      // While the knob is actively being moved, the hint text is swapped for
      // that point in time's timestamp; letting go restores the usual hint.
      var TIMELINE_HINT_DEFAULT = timelineHintText.textContent;

      // "input" only fires once the slider's value actually changes, so
      // starting a drag without yet crossing into the next tick showed
      // nothing -- "pointerdown" shows the current tick's timestamp right
      // away, before any movement.
      timelineSlider.addEventListener("pointerdown", function () {
        setTimelineText(formatTime(history[cursor].time));
      });
      timelineSlider.addEventListener("input", function () {
        var idx = parseInt(timelineSlider.value, 10);
        if (!Number.isNaN(idx) && idx !== cursor) restoreTo(idx);
        setTimelineText(formatTime(history[cursor].time));
      });

      // "change" alone isn't reliable for this: iOS Safari only fires it on
      // blur, not on touch release, so if the slider keeps focus after you
      // lift your finger, the timestamp would otherwise stay stuck. Range
      // inputs capture the pointer for the whole drag, so "pointerup" (and
      // "pointercancel", e.g. an interrupted touch) fire on the slider
      // itself regardless of where the release happens -- a more reliable
      // signal that the drag is actually over.
      function revertTimelineHint() {
        setTimelineText(TIMELINE_HINT_DEFAULT);
      }
      timelineSlider.addEventListener("pointerup", revertTimelineHint);
      timelineSlider.addEventListener("pointercancel", revertTimelineHint);
      timelineSlider.addEventListener("change", revertTimelineHint);
      timelineSlider.addEventListener("blur", revertTimelineHint);

      // Starting a drag directly on a tick used to do nothing until release
      // (a tick is its own <button>, sitting on top of the slider purely for
      // click-to-jump and its tooltip, so the pointerdown never reached the
      // slider underneath) -- this makes that same gesture jump to the tick
      // right away and then keep tracking the pointer exactly like a drag
      // started on open track does, by driving the slider itself. Capture is
      // taken on the track wrapper (which never gets rebuilt) rather than the
      // tick (which does get rebuilt on every restoreTo(), as updateTimelineUI()
      // replaces all the tick buttons) -- otherwise the capture would be lost
      // mid-drag the moment the index first changes.
      var tickDragPointerId = null;
      function timelineIndexFromClientX(clientX) {
        var track = timelineSlider.getBoundingClientRect();
        // Matches the tick placement formula above: the thumb (and so the
        // usable track) is inset 10px from each edge.
        var usable = Math.max(1, track.width - 20);
        var frac = (clientX - track.left - 10) / usable;
        frac = Math.max(0, Math.min(1, frac));
        return Math.round(frac * (history.length - 1));
      }
      function jumpToClientX(clientX) {
        var idx = timelineIndexFromClientX(clientX);
        if (idx !== cursor) restoreTo(idx);
        setTimelineText(formatTime(history[cursor].time));
      }
      timelineTrackWrap.addEventListener("pointerdown", function (e) {
        if (!e.target.classList || !e.target.classList.contains("timeline-tick")) return;
        tickDragPointerId = e.pointerId;
        timelineTrackWrap.setPointerCapture(e.pointerId);
        // A tick keeps its own "pointer" cursor on hover/click, but for the
        // duration of an actual drag it should read as a drag everywhere,
        // same as the open track -- forced via a body-level class since the
        // cursor is otherwise picked by whatever's visually under the
        // pointer, not by which element has capture.
        document.body.classList.add("is-scrubbing");
        jumpToClientX(e.clientX);
      });
      timelineTrackWrap.addEventListener("pointermove", function (e) {
        if (e.pointerId !== tickDragPointerId) return;
        jumpToClientX(e.clientX);
      });
      function endTickDrag(e) {
        if (e.pointerId !== tickDragPointerId) return;
        tickDragPointerId = null;
        try { timelineTrackWrap.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
        document.body.classList.remove("is-scrubbing");
        revertTimelineHint();
      }
      timelineTrackWrap.addEventListener("pointerup", endTickDrag);
      timelineTrackWrap.addEventListener("pointercancel", endTickDrag);

      // Smooth text transitions for the report banner and the timeline hint,
      // via Torph (https://torph.lochie.me/). Loaded on demand -- if it fails
      // to load, setReportText/setTimelineText just fall back to plain
      // textContent swaps, so the rest of the app doesn't depend on it.
      // Torph attaches to the inner *-text span, not the banner/hint element
      // itself: it forces its element to display: inline-block, which would
      // otherwise override the banner/hint's own block layout and knock its
      // centered text left-aligned. The outer element keeps its own CSS;
      // only the inner span is handed to Torph.
      // respectReducedMotion is off on purpose: these two spots are small,
      // low-motion text swaps, not the kind of thing prefers-reduced-motion
      // is meant to guard against.
      var reportMorph = null, timelineMorph = null;
      var latestReportText = reportBannerText.textContent;
      var latestTimelineText = timelineHintText.textContent;

      function setReportText(text) {
        latestReportText = text;
        if (reportMorph) reportMorph.update(text); else reportBannerText.textContent = text;
      }
      function setTimelineText(text) {
        latestTimelineText = text;
        if (timelineMorph) timelineMorph.update(text); else timelineHintText.textContent = text;
      }

      import("https://cdn.jsdelivr.net/npm/torph@0.1.3/+esm").then(function (mod) {
        reportMorph = new mod.TextMorph({ element: reportBannerText, respectReducedMotion: false });
        timelineMorph = new mod.TextMorph({ element: timelineHintText, respectReducedMotion: false });
        reportMorph.update(latestReportText);
        timelineMorph.update(latestTimelineText);
      }).catch(function (err) {
        /* Torph didn't load (offline, CDN down, etc.) -- plain text swaps still work. */
      });

      /* ---------- modal ---------- */
      // Shared by both "new idea" and "criticize idea" -- only the title,
      // placeholder, button label and submit handler change.
      //
      // Like the rest of the page, this never triggers a *native* form
      // submission: some hosting contexts render the page inside a sandboxed
      // iframe without "allow-forms", where a real submit is blocked by the
      // browser before any JS runs. Both buttons are type="button" with their
      // own click handlers instead.
      var modalEl = document.querySelector(".modal");
      var modalScroll = document.getElementById("modal-scroll");
      var modalBackdrop = document.getElementById("modal-backdrop");
      var modalTitle = document.getElementById("modal-title");
      var modalTextarea = document.getElementById("modal-textarea");
      var modalChecks = document.getElementById("modal-checks");
      var modalMenu = document.getElementById("modal-menu");
      var modalQuote = document.getElementById("modal-quote");
      var modalMessage = document.getElementById("modal-message");
      var modalForm = document.getElementById("modal-form");
      var modalSubmitBtn = document.getElementById("modal-submit");
      var modalCancelBtn = document.getElementById("modal-cancel");
      var modalMode = "form"; // "form" (textarea + onSubmit(text)) or "confirm" (message + onSubmit())
      var modalOnSubmit = null;
      var modalOpener = null;
      var modalIgnoreClicksUntil = 0;
      var modalOpen = false;
      var modalCloseTimer = null;

      // opts: title, buttonText, onSubmit, and either
      //   { placeholder, quote, value, checks } -- a text-entry modal, optionally
      //                                            quoting the idea it's about and
      //                                            offering tick boxes (see below), or
      //   { mode: "confirm", message, danger }  -- a yes/no confirmation, or
      //   { mode: "info", message }             -- a read-only note, single Close button, or
      //   { mode: "menu", items: [{ label, danger, onPick }] } -- a short list of
      //                                            things you might do next.
      //
      // `checks` is [{ key, label, note, checked, head }]; onSubmit is then
      // called with the text and the keys still ticked.
      function openModal(opts) {
        modalMode = opts.mode === "confirm" ? "confirm"
          : opts.mode === "info" ? "info"
          : opts.mode === "menu" ? "menu" : "form";
        modalTitle.textContent = opts.title;
        modalOnSubmit = opts.onSubmit;
        modalOpener = document.activeElement;

        modalSubmitBtn.hidden = modalMode === "info" || modalMode === "menu";
        if (!modalSubmitBtn.hidden) {
          modalSubmitBtn.textContent = opts.buttonText;
          modalSubmitBtn.classList.toggle("modal-btn--primary", !opts.danger);
          modalSubmitBtn.classList.toggle("modal-btn--danger", !!opts.danger);
        }
        modalCancelBtn.textContent = modalMode === "info" ? (opts.buttonText || "Close") : "Cancel";

        modalMenu.innerHTML = "";
        modalMenu.hidden = modalMode !== "menu";
        if (modalMode === "menu") {
          (opts.items || []).forEach(function (item) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "modal-btn " + (item.danger ? "modal-btn--danger" : "modal-btn--primary");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              closeModal();
              if (item.onPick) item.onPick();
            });
            modalMenu.appendChild(btn);
          });
        }

        modalChecks.innerHTML = "";
        modalChecks.hidden = !(modalMode === "form" && opts.checks && opts.checks.length);
        if (!modalChecks.hidden) {
          opts.checks.forEach(function (check) {
            var li = document.createElement("li");
            if (check.head) {
              li.className = "modal-checks-head";
              li.textContent = check.head;
              modalChecks.appendChild(li);
              if (!check.key) return; // a heading on its own
              li = document.createElement("li");
            }
            var label = document.createElement("label");
            label.className = "modal-check";
            var input = document.createElement("input");
            input.type = "checkbox";
            input.checked = check.checked !== false;
            input.setAttribute("data-key", check.key);
            var text = document.createElement("span");
            text.textContent = check.label;
            if (check.note) {
              var note = document.createElement("span");
              note.className = "modal-check-note";
              note.textContent = check.note;
              text.appendChild(note);
            }
            label.appendChild(input);
            label.appendChild(text);
            li.appendChild(label);
            modalChecks.appendChild(li);
          });
        }

        if (opts.quote) {
          modalQuote.textContent = opts.quote;
          modalQuote.hidden = false;
        } else {
          modalQuote.hidden = true;
        }

        if (modalMode === "confirm" || modalMode === "info" || modalMode === "menu") {
          modalTextarea.hidden = true;
          modalMessage.hidden = false;
          // Info-mode content is always our own hand-written copy (never
          // user-entered text), so it's set as HTML to allow paragraphs,
          // an italicized title and real links; everything else here is
          // plain text set via textContent, since it may echo back text
          // someone typed (an idea, a criticism).
          modalMessage.hidden = !opts.message;
          if (modalMode === "info") modalMessage.innerHTML = opts.message || "";
          else modalMessage.textContent = opts.message || "";
        } else {
          modalTextarea.hidden = false;
          modalMessage.hidden = true;
          modalTextarea.value = opts.value || "";
          modalTextarea.placeholder = opts.placeholder || "";
          modalTextarea.setAttribute("aria-label", opts.title);
        }

        if (modalCloseTimer) { clearTimeout(modalCloseTimer); modalCloseTimer = null; }
        modalBackdrop.hidden = false;
        modalOpen = true;
        // Add the open class on the next frame so the backdrop/modal
        // transition (opacity + a slight scale-up) actually plays, instead
        // of starting already in its end state.
        requestAnimationFrame(function () { modalBackdrop.classList.add("is-open"); });
        // addPress() already suppresses the touch "ghost click" that this guard
        // was originally written for (see its pointerdown handler); this is
        // just a small safety margin in case some other path opens the modal.
        modalIgnoreClicksUntil = Date.now() + 50;
        // Default focus goes to Cancel/Close for anything that isn't a text
        // entry, so a stray extra tap doesn't submit or delete anything.
        (modalMode === "form" ? modalTextarea : modalCancelBtn).focus();
        // The action buttons live outside .modal-scroll now, so focusing
        // one doesn't auto-scroll the content -- this is just a safety net
        // in case a modal is reopened without its scroll position resetting.
        modalScroll.scrollTop = 0;
      }

      function closeModal() {
        if (!modalOpen) return;
        modalOpen = false;
        modalBackdrop.classList.remove("is-open");
        // Wait for the fade-out to finish before actually hiding (and
        // removing from the layout/a11y tree) -- with a fallback timer in
        // case transitionend doesn't fire, e.g. under reduced motion.
        if (modalCloseTimer) clearTimeout(modalCloseTimer);
        modalCloseTimer = setTimeout(function () {
          modalBackdrop.hidden = true;
          modalCloseTimer = null;
        }, 200);
        modalOnSubmit = null;
        var opener = modalOpener;
        modalOpener = null;
        if (opener && typeof opener.focus === "function" && document.contains(opener)) {
          // Restoring focus to the node that opened the modal shouldn't re-show
          // its tooltip -- that's only meant to follow the mouse hovering it or
          // a real keyboard tab-in, not this programmatic refocus.
          interactions.suppressNodeFocusTip = true;
          opener.focus();
          interactions.suppressNodeFocusTip = false;
        }
      }

      function submitModal() {
        if (modalMode === "confirm") {
          var confirmFn = modalOnSubmit;
          closeModal();
          if (confirmFn) confirmFn();
          return;
        }
        var text = modalTextarea.value.trim();
        if (!text) { modalTextarea.focus(); return; }
        var ticked = [].slice.call(modalChecks.querySelectorAll("input:checked")).map(function (input) {
          return input.getAttribute("data-key");
        });
        var fn = modalOnSubmit;
        closeModal();
        if (fn) fn(text, ticked);
      }

      modalSubmitBtn.addEventListener("click", submitModal);
      modalCancelBtn.addEventListener("click", closeModal);
      modalForm.addEventListener("submit", function (e) { e.preventDefault(); }); // belt-and-braces
      modalBackdrop.addEventListener("click", function (e) {
        if (Date.now() < modalIgnoreClicksUntil) return;
        if (e.target === modalBackdrop) closeModal();
      });
      modalTextarea.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitModal(); }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape" || !modalOpen) return;
        e.stopPropagation();
        closeModal();
      });
      // A minimal focus trap: Tab from the last control wraps to the first, and back.
      modalEl.addEventListener("keydown", function (e) {
        if (e.key !== "Tab") return;
        var focusables = modalEl.querySelectorAll("textarea:not([hidden]), input[type=checkbox], button");
        if (!focusables.length) return;
        var first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });

      /* ---------- what a tap on the canvas does ---------- */
      interactions.onBackgroundTap = function (e) {
        // Remembered now, so the new idea lands roughly where you tapped.
        var point = forest.canvasPoint(e);
        openModal({
          title: "New idea",
          placeholder: "What’s the idea?",
          buttonText: "Add",
          onSubmit: function (text) {
            var idea = { id: uid(), text: text, children: [] };
            forest.placeNewRoot(idea, point);
            commit("add-idea", { text: idea.text });
          }
        });
      };

      var SUPERSEDE_KEY = "__supersede";
      var SUPERSEDED_TEXT = "This idea has been superseded by a later revision. (Added automatically.)";

      function criticizeIdea(target) {
        openModal({
          title: "Submit a criticism",
          quote: target.text,
          placeholder: "Criticize this idea",
          buttonText: "Criticize",
          onSubmit: function (text) {
            var child = { id: uid(), text: text, children: [] };
            target.children.push(child);
            commit("add-criticism", { text: child.text });
          }
        });
      }

      // Revising never overwrites: it adds a new version of the idea beside
      // the old one, carrying over whichever criticisms you say still apply
      // (they stay one criticism, now attacking both versions). Saying the
      // revision supersedes the old version files a criticism to that effect
      // against it, so the old version stops being adoptable by the ordinary
      // rule rather than by a special case.
      function reviseIdea(target) {
        // A "superseded" note is about the one version it was filed against,
        // so it isn't offered for carrying over to the new one.
        var kids = target.children.filter(function (child) { return !child.auto; });
        // Versions run in one line, so a revision always joins the end of the
        // chain -- revising an older version brings it back as the newest one
        // rather than branching off it.
        var chain = versionsBeside(target);
        var live = chain[chain.length - 1];
        var restoring = live !== target;

        var checks = [];
        if (kids.length) {
          checks.push({ head: kids.length === 1 ? "Does this criticism still apply?" : "Which criticisms still apply?" });
          kids.forEach(function (child) {
            checks.push({ key: child.id, label: preview(child.text, 80), checked: true });
          });
        }
        checks.push({
          head: restoring ? "The version in play" : "This version",
          key: SUPERSEDE_KEY,
          label: restoring
            ? "The revision supersedes “" + preview(live.text, 40) + "”"
            : "The revision supersedes it",
          note: "Files a criticism saying so, so it stops being adoptable.",
          checked: true
        });

        openModal({
          title: "Revise this idea",
          quote: target.text,
          placeholder: "What’s the better version?",
          value: target.text,
          buttonText: "Revise",
          checks: checks,
          onSubmit: function (text, ticked) {
            var revision = { id: uid(), text: text, children: [], versionOf: live.id };
            kids.forEach(function (child) {
              if (ticked.indexOf(child.id) !== -1) revision.children.push(child);
            });
            // The new version hangs from everything the chain hangs from,
            // at the end of it.
            parentsOf(live.id).forEach(function (parent) {
              parent.children.splice(parent.children.indexOf(live) + 1, 0, revision);
            });
            var atRoot = roots.indexOf(live);
            if (atRoot !== -1) roots.splice(atRoot + 1, 0, revision);
            var supersedes = ticked.indexOf(SUPERSEDE_KEY) !== -1;
            if (supersedes) {
              live.children.push({ id: uid(), text: SUPERSEDED_TEXT, children: [], auto: true });
            }
            commit("revise", { text: text, ofText: target.text, supersedes: supersedes });
          }
        });
      }

      function confirmDelete(target, d) {
        var n = countDescendants(target);
        var shared = parentsOf(target.id).length > 1;
        var message = "Are you sure you want to delete “" + preview(d.text, 32) + "”" +
          (n > 0 ? " and its " + n + (n === 1 ? " criticism" : " criticisms") : "") + "?" +
          (shared ? " It applies to more than one version of an idea, and goes from all of them." : "");
        openModal({
          mode: "confirm",
          title: "Confirm delete",
          message: message,
          buttonText: "Delete",
          danger: true,
          onSubmit: function () {
            removeIdea(d.id);
            commit("delete", { text: d.text, count: n });
          }
        });
      }

      interactions.onNodeTap = function (e, d) {
        var target = findIdea(d.id);
        if (!target) return;
        // Shift+click deletes immediately, skipping both the menu and the
        // confirmation -- an accelerator for people who know what they're
        // doing (e.g. during a live demo).
        if (e.shiftKey) {
          var n = countDescendants(target);
          removeIdea(d.id);
          commit("delete", { text: d.text, count: n });
          return;
        }
        openModal({
          mode: "menu",
          title: "This idea",
          quote: target.text,
          items: [
            { label: "Criticize", onPick: function () { criticizeIdea(target); } },
            { label: "Revise", onPick: function () { reviseIdea(target); } },
            { label: "Delete", danger: true, onPick: function () { confirmDelete(target, d); } }
          ]
        });
      };

      document.getElementById("fit-btn").addEventListener("click", function () { forest.fit(); });

      // The legend is handy but eats into a small screen, so it folds away.
      // It starts open everywhere; whichever way you leave it is remembered.
      var legend = document.getElementById("legend");
      var legendBtn = document.getElementById("legend-btn");
      function setLegendOpen(open, remember) {
        ui.legendOpen = open;
        legend.hidden = !open;
        legendBtn.setAttribute("aria-expanded", open ? "true" : "false");
        legendBtn.textContent = open ? "Hide key" : "Key";
        if (remember) saveHistory();
      }
      legendBtn.addEventListener("click", function () { setLegendOpen(legend.hidden, true); });

      document.getElementById("info-btn").addEventListener("click", function () {
        openModal({
          mode: "info",
          title: "About this app",
          message:
            "<p>We can rationally adopt an idea only if it has no pending criticisms – not because it’s been proven, but because it has, so far, survived scrutiny. That follows Karl Popper’s view that theories are never proven true, only ever tentatively accepted until refuted.</p>" +
            "<p>In <em>Objective Knowledge</em>, Popper wants “a concise report evaluating the state (at a certain time <em>t</em>) of the critical discussion of a theory, with respect to the way it solves its problems…” The banner at the top of the page, and the timeline at the bottom are, in that sense, a running report of the current state of the discussion.</p>" +
            "<p>This page is a small visual preview of the features on <a href=\"https://veritula.com\" target=\"_blank\" rel=\"noopener noreferrer\">veritula.com</a>. It’s meant as a modern-day solution to the ancient philosophical problem of how to form a <em>rational preference</em> between competing ideas. Built by <a href=\"https://dennishackethal.com\" target=\"_blank\" rel=\"noopener noreferrer\">Dennis Hackethal</a>.</p>",
          buttonText: "Close"
        });
      });

      document.getElementById("reset-btn").addEventListener("click", function () {
        openModal({
          mode: "confirm",
          title: "Reset everything",
          message: "Delete all ideas and clear the history? This can’t be undone.",
          buttonText: "Reset",
          danger: true,
          onSubmit: function () {
            roots = [];
            rowsMeta = null;
            history = [{ snapshot: { roots: [], nodes: [], edges: [] }, type: "start", detail: {}, time: Date.now() }];
            cursor = 0;
            try {
              localStorage.removeItem(HISTORY_KEY);
              localStorage.removeItem(STORAGE_KEY);
            } catch (err) {
              /* storage unavailable: in-memory state is still reset */
            }
            refresh();
            updateTimelineUI();
          }
        });
      });

      loadHistory();
      setLegendOpen(ui.legendOpen, false);
      refresh();
      updateTimelineUI();
    })();
  </script>
</body>
</html>
