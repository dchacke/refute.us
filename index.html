<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Layout Example</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .left, .right {
      flex: 1;
      padding: 2rem;
      box-sizing: border-box;
    }
    .left {
      background: #f0f0f0;
      border-right: 2px solid #ddd;
    }
    .right {
      background: #fff;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }
      .left, .right {
        border-right: none;
        border-bottom: 2px solid #ddd;
      }
      .right {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h2>Left Side</h2>
      <form id="root-idea-form">
        <label for="user-text">Enter text:</label><br>
        <textarea id="user-text" name="user-text" rows="6" style="width:100%;"></textarea><br>
        <button type="submit" style="margin-top:8px;">Submit</button>
      </form>
      <div id="idea-list" style="margin-top:24px;"><h3>Ideas</h3><ul style="padding-left: 1.2em;" id="ideas-ul"></ul></div>
    </div>
    <div class="right">
      <h2>Right Side</h2>
      <canvas id="graph-canvas" style="width: 100%; height: 400px; background: #e9f5ff; border: 2px dashed #99c2e6; display: block;"></canvas>
    </div>
  </div>
<script>
// --- Idea list and drawing logic ---
let ideas = [];
let ideaId = 1;


const form = document.querySelector('form');
const textarea = document.getElementById('user-text');
const canvas = document.getElementById('graph-canvas');

function resizeCanvas() {
  // Set actual internal size for crisp rendering.
  const cssWidth = canvas.offsetWidth;
  const cssHeight = canvas.offsetHeight;
  canvas.width = cssWidth;
  canvas.height = cssHeight;
}

function drawCircles() {
  resizeCanvas();
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (ideas.length === 0) {
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#579';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Graph will appear here', canvas.width/2, canvas.height/2);
    return;
  }

  // Layout constants
  const nodeRadius = 32;
  const vertGap = 40 + nodeRadius * 2; // Vertical space between levels
  const treeGap = 90 + nodeRadius * 2; // Horizontal space between different trees
  const marginTop = 40;
  const marginLeft = 40;

  // Helper function to compute max depth and width of a tree
  function getTreeHeight(idea) {
    if (!idea.children || idea.children.length === 0) return 1;
    return 1 + Math.max(...idea.children.map(getTreeHeight));
  }
  function countNodes(idea) {
    if (!idea.children || idea.children.length === 0) return 1;
    return 1 + idea.children.map(countNodes).reduce((a, b) => a + b, 0);
  }

  // Calculate X for each root
  let treeXs = [];
  let totalWidthNeeded = 0;
  for (let i = 0; i < ideas.length; i++) {
    treeXs.push(marginLeft + totalWidthNeeded);
    let widthNeeded = 2 * nodeRadius; // Each root gets a column at least a bubble wide
    widthNeeded += (i < ideas.length-1) ? treeGap : 0;
    totalWidthNeeded += widthNeeded;
  }

  // Traverse each tree and assign (x, y) coordinates
  let allNodes = [];
  // Improved: Fan out children horizontally, center parent above children.
  function getSubtreeWidth(idea) {
    if (!idea.children || idea.children.length === 0) return 1;
    return idea.children.reduce((sum, ch) => sum + getSubtreeWidth(ch), 0);
  }
  let baseRootLeft = marginLeft;
  for (let t = 0; t < ideas.length; t++) {
    let treeRoot = ideas[t];
    let rootTreeWidth = getSubtreeWidth(treeRoot);
    let treePixelWidth = rootTreeWidth * (2 * nodeRadius + treeGap);
    let baseX = baseRootLeft + treePixelWidth / 2;
    let baseY = marginTop;
    function layoutTree(idea, x, y, parent) {
      let myWidth = getSubtreeWidth(idea);
      let node = { idea, x, y, parent };
      allNodes.push(node);
      if (!idea.children || idea.children.length === 0) return [x];
      // Compute total width to span children
      let totalWidth = idea.children.reduce((sum, ch) => sum + getSubtreeWidth(ch), 0);
      let leftX = x - (totalWidth * (2 * nodeRadius + treeGap) - treeGap) / 2;
      let childrenXs = [];
      let cx = leftX;
      for (let i = 0; i < idea.children.length; i++) {
        let w = getSubtreeWidth(idea.children[i]);
        let childCenter = cx + (w * (2 * nodeRadius + treeGap) - treeGap) / 2;
        childrenXs = childrenXs.concat(layoutTree(idea.children[i], childCenter, y + vertGap, {x, y}));
        cx += w * (2 * nodeRadius + treeGap);
      }
      return [x];
    }
    layoutTree(treeRoot, baseX, baseY, null);
    baseRootLeft += treePixelWidth + treeGap;
  }

  // Draw edges
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 2;
  for (const node of allNodes) {
    if (node.parent) {
      ctx.beginPath();
      ctx.moveTo(node.parent.x, node.parent.y + nodeRadius);
      ctx.lineTo(node.x, node.y - nodeRadius);
      ctx.stroke();
    }
  }

  // Draw bubbles (circles with numbers)
  for (const node of allNodes) {
    ctx.beginPath();
    ctx.arc(node.x, node.y, nodeRadius, 0, 2*Math.PI);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#4c88b3';
    ctx.lineWidth = 4;
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#347';
    ctx.fillText(String(node.idea.id), node.x, node.y);
  }
}


function renderIdeaList() {
  const ul = document.getElementById('ideas-ul');
  ul.innerHTML = '';
  function renderIdeaNode(idea, level) {
    const li = document.createElement('li');
    li.style.marginLeft = (level * 28) + 'px';
    li.innerHTML = `<strong>${idea.id}.</strong> ${idea.text}`;
    // Critique form (nested for this idea)
    const form = document.createElement('form');
    form.style.marginTop = '6px';
    form.innerHTML = `
      <textarea rows="2" style="width:80%; resize: vertical" placeholder="Critique this idea..."></textarea>
      <button type="submit">Critique</button>
    `;
    const textarea = form.querySelector('textarea');
    textarea.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const val = textarea.value.trim();
      if (!val) return;
      idea.children.push({id: ideaId++, text: val, children: []});
      renderIdeaList();
      drawCircles();
    });
    li.appendChild(form);
    // Render children
    if (idea.children && idea.children.length > 0) {
      const childUl = document.createElement('ul');
      childUl.style.paddingLeft = '0.7em';
      idea.children.forEach(child => {
        childUl.appendChild(renderIdeaNode(child, level+1));
      });
      li.appendChild(childUl);
    }
    return li;
  }
  for (const idea of ideas) {
    ul.appendChild(renderIdeaNode(idea, 0));
  }
}

const rootForm = document.getElementById('root-idea-form');
const rootTextarea = document.getElementById('user-text');
rootTextarea.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    rootForm.requestSubmit();
  }
});
rootForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const ideaText = rootTextarea.value.trim();
  if (!ideaText) return;
  ideas.push({ id: ideaId++, text: ideaText, children: [] });
  rootTextarea.value = '';
  drawCircles();
  renderIdeaList();
});

window.addEventListener('resize', drawCircles);
drawCircles();
renderIdeaList();
</script>
</body>
</html>
