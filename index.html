<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refute Us</title>
<style>
  /* Dark mode is always on, regardless of the system color scheme. */
  :root {
    --left: #262c3a;
    --right: #0d1220;
    --divider: #8a7550;
    --ink: #e6e9f0;
    --muted: #a3acc0;
    --rule: #3d465a;
    --field-bg: #1a1f2b;
    --field-border: #4f5970;
    --button-bg: #c9b184;
    --button-fg: #0d1220;
    --focus: #c9b184;
    /* the canvas is dark in both themes, so these stay the same */
    --link: rgba(232, 235, 240, 0.6);
    --node-root: #d4b982;
    --node-crit: #ff5a52;
    --label: #e6e9f0;
    --label-dim: rgba(230, 233, 240, 0.8);
    --tip-bg: #e8ebf0;
    --tip-fg: #1b2233;
    --tip-muted: #566078;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--right);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    height: 100%;
    margin: 0;
    background: var(--right);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .split {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
  }

  .canvas {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    background: var(--right);
  }

  /* ---------- forest chart ---------- */
  .forest {
    /* Without this, a long-press on iOS Safari (used here to open the
       delete confirmation) is also read as a text-selection gesture --
       preventDefault() on pointerdown isn't enough to stop it -- and the
       selection/callout UI can still be showing once the modal opens. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  .forest .bg { fill: transparent; }

  .forest .link {
    fill: none;
    stroke: var(--link);
    stroke-width: 1.5px;
  }

  /* An edge pointing at a rationally adoptable criticism picks up that node's
     color. It stays a plain solid line -- the glow and the "flowing toward
     the parent" cue both live on the moving glow riding on top of it
     (below), rather than on the edge itself. */
  .forest .link.is-adoptable {
    stroke: color-mix(in srgb, var(--node-crit) 85%, white);
    opacity: 1;
  }

  /* Matches the edge's own color exactly, so the moving shape reads as a
     faint glow traveling along the edge toward the parent, rather than a
     distinct marker riding on top of it. It's a filled shape computed in JS
     (see flowPolygon), tapered down to the edge's own 1.5px width at each
     end so it blends into the edge's outline instead of cutting off against
     it -- at this size and opacity that taper mostly reads as a soft
     brightening rather than a visibly separate shape, which is the effect
     we want. */
  .forest .link-flow {
    fill: color-mix(in srgb, var(--node-crit) 85%, white);
    stroke: none;
    opacity: 0.9;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .forest .link-flow {
      animation: adopt-glow 2.6s ease-in-out infinite;
    }
  }

  .forest .node { cursor: grab; }
  .forest .node:focus { outline: none; }

  /* While a node is being dragged, show a "grabbing" cursor everywhere
     over the canvas, not just over the node itself (the pointer can
     outrun the node during a fast drag). */
  .forest.is-dragging,
  .forest.is-dragging .node { cursor: grabbing; }

  .forest .node circle.core {
    fill: var(--node-crit);
    stroke: var(--right);
    stroke-width: 2px;
  }

  /* A solid disc reads as slightly smaller than a same-radius outline circle
     (a common optical effect), so nudge it up a touch to compensate. The
     rim is a darker shade of the same color (rather than matching the fill
     exactly) for a touch of definition. */
  .forest .node.is-adoptable circle.core {
    stroke: color-mix(in srgb, var(--node-crit) 65%, black);
    stroke-width: 2px;
    transform: scale(1);
    transform-box: fill-box;
    transform-origin: center;
  }

  .forest .node.is-root circle.core { fill: var(--node-root); }
  .forest .node.is-root.is-adoptable circle.core { stroke: color-mix(in srgb, var(--node-root) 65%, black); }

  /* Hollow (not rationally adoptable) discs keep the plain, full-brightness
     color for their outline rather than the darker rim above -- with no
     fill of their own to set them off, a darkened stroke read as barely
     visible against the dark canvas background. */
  .forest .node:not(.is-adoptable) circle.core {
    fill: var(--right);
    stroke: var(--node-crit);
    stroke-width: 2px;
  }

  .forest .node.is-root:not(.is-adoptable) circle.core { stroke: var(--node-root); }

  /* A small, tight "lift" shadow under every node, independent of (and
     layered under) the pulsing adopt-glow, which stays scoped to
     circle.core alone. */
  .forest .node { filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.35)); }

  .forest .node.is-highlighted circle.core,
  .forest .node.is-root.is-highlighted circle.core {
    stroke: var(--label);
    stroke-width: 2.5px;
  }

  /* A slow, subtle glow/pulse marks rationally adoptable nodes as "live". */
  @media (prefers-reduced-motion: no-preference) {
    .forest .node.is-adoptable circle.core {
      animation: adopt-glow 2.6s ease-in-out infinite;
    }
  }

  /* Joins two versions of the same idea: not an attack, so it's drawn as a
     quiet dashed tie rather than a solid edge. */
  .forest .version-link {
    fill: none;
    stroke: var(--label-dim);
    stroke-width: 1.5px;
    stroke-dasharray: 5 4;
    opacity: 0.75;
    pointer-events: none;
  }

  @keyframes adopt-glow {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0)); }
    50% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7)); }
  }

  .forest .node text {
    fill: var(--label);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    paint-order: stroke;
    stroke: var(--right);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .forest .node.is-root text { font-size: 11.5px; font-weight: 600; }
  .forest .node:not(.is-adoptable) text { fill: var(--label-dim); }

  /* A short preview of a criticism's own text, sitting just under its node. */
  .forest .node text.preview {
    text-anchor: middle;
    font-size: 9px;
  }

  /* Shown only until the first idea exists, since that's otherwise the only
     way to discover that the canvas itself is where you add one. */
  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    color: var(--label-dim);
    font-size: 1.05rem;
    pointer-events: none;
  }

  .empty-hint[hidden] { display: none; }

  .fit-btn {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 3;
    padding: 0.5rem 0.9rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--label);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--link);
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 150ms ease, transform 100ms ease;
  }

  .fit-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .fit-btn:active { transform: translateY(1px); }

  .reset-btn { right: auto; left: 0.75rem; width: auto; }
  .fit-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .info-btn {
    top: auto;
    bottom: 0.75rem;
    width: 2rem;
    height: 2rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.95rem;
    font-style: italic;
    border-radius: 50%;
  }

  .tip {
    position: absolute;
    z-index: 2;
    max-width: min(18rem, calc(100% - 1rem));
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--tip-fg);
    background: var(--tip-bg);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }

  .tip-status {
    margin-top: 0.25rem;
    color: var(--tip-muted);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .tip-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 8;
    overflow: hidden;
  }

  .legend-btn {
    top: auto;
    left: 0.75rem;
    right: auto;
    bottom: 0.75rem;
    padding: 0.35rem 0.8rem;
    font-size: 0.78rem;
  }

  .legend {
    position: absolute;
    left: 0.75rem;
    bottom: 3.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.8rem;
    color: var(--label-dim);
    pointer-events: none;
  }

  .legend li { display: flex; align-items: center; gap: 0.5rem; }
  .legend svg { flex: none; }
  .legend .key-on {
    fill: var(--label);
    stroke: var(--right);
    stroke-width: 2px;
    transform: scale(1.15);
    transform-box: fill-box;
    transform-origin: center;
  }
  .legend .key-off { fill: var(--right); stroke: var(--label); stroke-width: 2px; }

  .legend-hint {
    margin-top: 0.15rem;
    padding-top: 0.4rem;
    border-top: 1px solid var(--link);
  }

  .legend-hint:first-of-type { margin-top: 0.25rem; }
  .legend-hint + .legend-hint { margin-top: 0; padding-top: 0; border-top: 0; }
  .legend[hidden] { display: none; }

  /* ---------- report banner (state of the discussion) ---------- */
  .report-banner {
    flex: none;
    padding: 0.6rem clamp(1rem, 4vw, 2rem);
    background: var(--left);
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
  }

  /* ---------- timeline (history scrubber) ---------- */
  .timeline {
    flex: none;
    padding: 0.75rem clamp(1rem, 4vw, 2rem) calc(0.75rem + env(safe-area-inset-bottom, 0px));
    background: var(--left);
    border-top: 1px solid var(--rule);
  }

  .timeline-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
    color: var(--ink);
  }

  .timeline-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }

  .timeline-count {
    flex: none;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .timeline-track-wrap {
    position: relative;
    height: 1.5rem;
    display: flex;
    align-items: center;
  }

  /* Sits below the slider track, centered. */
  .timeline-hint {
    display: block;
    margin-top: 0.25rem;
    text-align: center;
    white-space: nowrap;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--muted);
    pointer-events: none;
    /* Keeps digits a fixed width, so the timestamp shown here while
       scrubbing doesn't shift horizontally as it morphs between values. */
    font-variant-numeric: tabular-nums;
  }

  .timeline-hint[hidden] { display: none; }

  .timeline-slider {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    /* Without this, a touch drag that isn't perfectly horizontal is partly
       read as a page scroll on iOS/iPadOS, fighting the slider. This hands
       the browser's touch gesture recognition entirely to the slider itself
       (which drags the thumb via its own native pointer handling, not
       through page scrolling), so a diagonal finger movement no longer
       scrolls the page. */
    touch-action: none;
    width: 100%;
    height: 1.5rem;
    margin: 0;
    background: transparent;
    cursor: ew-resize;
  }

  .timeline-slider::-webkit-slider-runnable-track {
    height: 4px;
    background: color-mix(in srgb, var(--rule) 55%, white);
    border-radius: 2px;
  }

  .timeline-slider::-moz-range-track {
    height: 4px;
    background: color-mix(in srgb, var(--rule) 55%, white);
    border-radius: 2px;
  }

  .timeline-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    margin-top: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    box-shadow: none;
  }

  .timeline-slider::-moz-range-thumb {
    -moz-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    box-shadow: none;
  }

  .timeline-slider:disabled { cursor: default; opacity: 0.5; }

  .timeline-slider:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .timeline-ticks {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 0;
    pointer-events: none;
  }

  .timeline-tick {
    position: absolute;
    top: 0;
    transform: translate(-50%, -50%);
    width: 13px;
    height: 13px;
    padding: 0;
    border-radius: 50%;
    background: var(--field-bg);
    border: 2px solid var(--field-border);
    pointer-events: auto;
    cursor: pointer;
    transition: border-color 150ms ease;
    /* Same fix as .timeline-slider: a drag that starts on a tick (rather
       than the thumb itself) needs the browser to hand the whole gesture to
       our own pointer handling instead of partly reading a non-horizontal
       finger movement as a page scroll. Ticks are small and easy to land a
       thumb on first, so without this the bug was still reachable through
       them even after the slider itself was fixed. */
    touch-action: none;
  }

  .timeline-tick.is-active {
    background: var(--button-bg);
    border-color: var(--button-bg);
    /* Now that ticks line up exactly with the thumb's position, the active
       one sits right on top of it -- pass clicks through so the thumb
       underneath can still be grabbed and dragged. */
    pointer-events: none;
  }

  .timeline-tick:hover { border-color: var(--focus); }
  .timeline-tick:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Forces the ew-resize cursor everywhere while a tick-initiated drag is in
     progress (see the pointerdown handling on .timeline-track-wrap in the
     script) -- without this, the cursor would fall back to whatever's
     actually under the pointer, e.g. a tick's own "pointer" cursor, even
     though the gesture is a drag the whole time it's held. */
  body.is-scrubbing, body.is-scrubbing * { cursor: ew-resize !important; }

  /* ---------- modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(10, 12, 18, 0.55);
    opacity: 0;
    transition: opacity 180ms ease;
  }

  .modal-backdrop.is-open { opacity: 1; }

  .modal-backdrop[hidden] { display: none; }

  .modal {
    width: 100%;
    max-width: 26rem;
    /* The backdrop's own 1.5rem padding already keeps this off the edges
       of the viewport; capping height at 100% of that means a modal with
       a lot of content never pushes its buttons off-screen on a short
       viewport -- .modal-scroll below is what actually scrolls, so the
       action buttons (outside it) stay pinned and always reachable. */
    max-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background: var(--left);
    color: var(--ink);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    transform: scale(0.96) translateY(6px);
    transition: transform 180ms ease;
  }

  .modal-backdrop.is-open .modal { transform: scale(1) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .modal-backdrop, .modal { transition: none; }
  }

  .modal-title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .modal-form {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    gap: 1rem;
  }

  /* Everything above the action buttons: scrolls on its own when a modal's
     content is taller than the viewport, while .modal-actions (outside
     this) stays pinned and always visible/reachable. */
  .modal-scroll {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    gap: 1rem;
    overflow-y: auto;
    /* Setting overflow-y alone makes overflow-x clip too (the two can't be
       "auto" and "visible" at once), which was cutting off the textarea's
       focus ring on the left and bottom -- padding gives it room on the
       sides that need it, and the matching negative margin cancels the
       padding back out so nothing visually shifts. Top is left alone: a
       focus ring there was never clipped (nothing sits flush against it). */
    padding: 0 0.375rem 0.375rem 0.375rem;
    margin: 0 -0.375rem -0.375rem -0.375rem;
  }

  .modal-checks {
    margin: 0.9rem 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .modal-checks li { display: flex; }

  .modal-check {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--ink);
    cursor: pointer;
  }

  .modal-check input { margin: 0.2rem 0 0; flex: none; width: 1rem; height: 1rem; accent-color: var(--focus); }
  .modal-check-note { display: block; margin-top: 0.1rem; font-size: 0.8rem; color: var(--muted); }
  .modal-checks .modal-checks-head {
    display: block;
    margin-top: 0.25rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .modal-menu {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .modal-menu .modal-btn { width: 100%; }

  .modal-textarea {
    width: 100%;
    min-height: 8rem;
    padding: 0.75rem 0.875rem;
    font: inherit;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 6px;
    resize: vertical;
  }

  .modal-message {
    margin: 0;
    line-height: 1.5;
  }

  /* Info-mode content is set as trusted, hand-authored HTML (multiple
     paragraphs, a book title, links) rather than the plain text used
     everywhere else in the modal. */
  .modal-message p { margin: 0 0 0.75rem; }
  .modal-message p:last-child { margin-bottom: 0; }
  .modal-message a { color: var(--button-bg); }
  .modal-message a:hover { text-decoration: none; }

  .modal-quote {
    margin: 0;
    padding: 0.5rem 0 0.5rem 0.875rem;
    border-left: 3px solid var(--field-border);
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
    font-style: italic;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 6rem;
    overflow-y: auto;
  }

  .modal-quote[hidden] { display: none; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
  }

  .modal-btn {
    padding: 0.6rem 1.25rem;
    font: inherit;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }

  .modal-btn--ghost {
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--field-border);
  }

  .modal-btn--ghost:hover { background: rgba(255, 255, 255, 0.08); }

  .modal-btn--primary {
    color: var(--button-fg);
    background: var(--button-bg);
    border: 0;
  }

  .modal-btn--primary:hover { background: color-mix(in srgb, var(--button-bg) 85%, white); }

  .modal-btn--danger {
    color: #ffffff;
    background: #b3261e;
    border: 0;
  }

  .modal-btn--danger:hover { background: color-mix(in srgb, #b3261e 85%, white); }

  .modal-btn:active { transform: translateY(1px); }

  .modal-textarea:focus-visible,
  .modal-btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  @media (max-width: 720px) {
    .timeline { padding: 0.625rem 1rem calc(0.625rem + env(safe-area-inset-bottom, 0px)); }
    .fit-btn { top: 0.5rem; right: 0.5rem; }
    .reset-btn { right: auto; left: 0.5rem; }
    .info-btn { top: auto; bottom: 0.5rem; right: 0.5rem; }
    .legend-btn { top: auto; right: auto; left: 0.5rem; bottom: 0.5rem; }
    /* Smaller and tighter on a phone, where the canvas is the scarce thing. */
    .legend { left: 0.5rem; bottom: 2.6rem; font-size: 0.72rem; gap: 0.15rem; }
    .legend li { gap: 0.35rem; }
    .legend svg { width: 18px; height: 18px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="report-banner" id="report-banner"><span id="report-banner-text"></span></div>
    <main class="split">
      <section class="canvas" id="forest-pane" aria-label="Idea forest">
        <svg class="forest" id="forest" role="group" aria-label="Forest of ideas and their criticisms"></svg>
        <p class="empty-hint" id="empty-hint">Tap anywhere in empty space to add your first idea.</p>
        <button type="button" class="fit-btn" id="fit-btn">Fit</button>
        <button type="button" class="fit-btn reset-btn" id="reset-btn">Reset</button>
        <button type="button" class="fit-btn info-btn" id="info-btn" aria-label="About this app">i</button>
        <div class="tip" id="tip" hidden>
          <span class="tip-text" id="tip-text"></span>
          <div class="tip-status" id="tip-status"></div>
        </div>
        <button type="button" class="fit-btn legend-btn" id="legend-btn" aria-expanded="true" aria-controls="legend">Key</button>
        <ul class="legend" id="legend" aria-label="Legend">

          <li><svg width="24" height="24" viewBox="-12 -12 24 24" aria-hidden="true"><circle class="key-off" r="8"></circle></svg>Not rationally adoptable.</li>

    </main>

  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>

      <form class="modal-form" id="modal-form">
        <div class="modal-scroll" id="modal-scroll">

          <blockquote class="modal-quote" id="modal-quote" hidden></blockquote>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = "ideas";       // legacy key, read only, for migration
      var HISTORY_KEY = "ideas-history-v1";
      // The ideas, as a graph: each idea is { id, text, children: [idea, ...] },
      // and an idea can appear as a child of more than one parent (the same
      // criticism applying to two versions of an idea). Children are held by
      // reference, so a shared one really is a single idea; the flat
      // nodes-and-edges shape it's saved in is built by ideasToGraph below.
      var roots = [];
      // How the current point in history's rows were arranged -- see the
      // "rows of trees" section. { manual: whether you arranged them
      // yourself, w/h: the pane size at the time }, or null. Top-level
      // ideas carry their own saved row as idea.row.
      var rowsMeta = null;
      // View preferences that outlive a visit, saved alongside the history.
      var ui = { legendOpen: true };
      function copyRowsMeta(m) {
        return (m && typeof m === "object" && typeof m.w === "number" && typeof m.h === "number")

      }

      function uid() {
        return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
      }

      // A short preview of an idea's own text, for referring to it in modals
      // instead of its number (e.g. "1.2"), which is no longer shown to users.
      function preview(text, max) {
        var flat = text.replace(/\s+/g, " ").trim();
        // Truncating to `max` chars and adding "…" only actually shortens
        // the text when there's more than one character being cut -- at
        // exactly one character over, the "…" just replaces that one
        // character one-for-one (e.g. "Newtonian gravity" at max 16 becomes
        // "Newtonian gravit…", same length as the original), so it isn't
        // worth doing.
        return flat.length > max + 1 ? flat.slice(0, max) + "…" : flat;
      }

      // Every idea reachable from `list`, each one once however many parents
      // it has, in the order they're first met.
      function allIdeas(list) {
        var out = [], seen = {};
        (function visit(ideas) {
          ideas.forEach(function (idea) {
            if (seen[idea.id]) return;
            seen[idea.id] = true;
            out.push(idea);
            visit(idea.children);
          });
        })(list || roots);
        return out;
      }

      function findIdea(id, list) {
        var all = allIdeas(list);
        for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
        return null;
      }

      function countDescendants(node) {
        return allIdeas(node.children).length;
      }

      // Takes an idea out of the discussion entirely: off every parent it
      // hangs from, so a criticism shared by two versions of an idea goes
      // from both. Anything left only underneath it goes with it, since
      // nothing reaches it any more.
      function removeIdea(id, list) {
        var gone = false;
        list = list || roots;
        for (var i = list.length - 1; i >= 0; i--) {
          if (list[i].id === id) { list.splice(i, 1); gone = true; }
        }
        allIdeas(list).forEach(function (idea) {
          for (var i = idea.children.length - 1; i >= 0; i--) {
            if (idea.children[i].id === id) { idea.children.splice(i, 1); gone = true; }
          }
        });
        return gone;
      }

      // Every idea the given one hangs from: more than one once a criticism
      // applies to two versions of an idea.
      function parentsOf(id, list) {
        return allIdeas(list).filter(function (idea) {
          return idea.children.some(function (child) { return child.id === id; });
        });
      }

      // Versions of an idea form a chain: each one is a revision of the one
      // before it (idea.versionOf), and the last is the one in play. This
      // returns that chain, oldest first, from among the ideas an idea sits
      // beside -- its fellow top-level ideas, or its parent's criticisms.
      function versionsBeside(idea) {
        var siblings = roots.indexOf(idea) !== -1 ? roots : (parentsOf(idea.id)[0] || { children: [] }).children;
        var byId = {};
        siblings.forEach(function (other) { byId[other.id] = other; });
        var oldest = idea, seen = {};
        while (oldest.versionOf && byId[oldest.versionOf] && !seen[oldest.id]) {
          seen[oldest.id] = true;
          oldest = byId[oldest.versionOf];
        }
        var chain = [oldest], guard = {};
        for (;;) {
          var current = chain[chain.length - 1];
          if (guard[current.id]) break;
          guard[current.id] = true;
          var next = null;
          siblings.forEach(function (other) { if (other.versionOf === current.id && !next) next = other; });
          if (!next) break;
          chain.push(next);
        }
        return chain;
      }

      /* ---------- saved shape ---------- */
      // Ideas are saved flat -- every idea once, plus the parent-to-child
      // edges between them -- because a shared idea can't be written twice
      // as nested JSON without becoming two ideas on the way back in.
      function ideasToGraph(list) {
        var nodes = [], edges = [], seen = {};
        (function visit(ideas) {
          ideas.forEach(function (idea) {
            if (seen[idea.id]) return;
            seen[idea.id] = true;
            var node = { id: idea.id, text: idea.text };
            if (typeof idea.row === "number") node.row = idea.row;
            if (typeof idea.versionOf === "string") node.versionOf = idea.versionOf;
            if (idea.auto) node.auto = true;
            nodes.push(node);
            idea.children.forEach(function (child) { edges.push([idea.id, child.id]); });
            visit(idea.children);
          });
        })(list);
        return { roots: list.map(function (idea) { return idea.id; }), nodes: nodes, edges: edges };
      }

      function graphToIdeas(graph) {
        var byId = {};
        (graph && graph.nodes ? graph.nodes : []).forEach(function (node) {
          var idea = { id: node.id, text: node.text, children: [] };
          if (typeof node.row === "number") idea.row = node.row;
          if (typeof node.versionOf === "string") idea.versionOf = node.versionOf;
          if (node.auto) idea.auto = true;
          byId[idea.id] = idea;
        });
        (graph && graph.edges ? graph.edges : []).forEach(function (edge) {
          var parent = byId[edge[0]], child = byId[edge[1]];
          if (parent && child && parent.children.indexOf(child) === -1) parent.children.push(child);
        });
        return (graph && graph.roots ? graph.roots : [])
          .map(function (id) { return byId[id]; })
          .filter(Boolean);
      }

      // A working copy that keeps sharing intact: one new idea per id, joined
      // up the same way as the original.
      function cloneIdeas(list) {
        return graphToIdeas(ideasToGraph(list));
      }

      // Whatever came out of storage, as a graph we can actually rely on:
      // ids and text present, edges pointing at ideas that exist.
      function readGraph(raw) {
        if (Array.isArray(raw)) return ideasToGraph(raw.map(normalize).filter(Boolean)); // nested, pre-v3
        if (!raw || typeof raw !== "object") return { roots: [], nodes: [], edges: [] };
        var nodes = [], byId = {};
        (Array.isArray(raw.nodes) ? raw.nodes : []).forEach(function (node) {
          if (!node || typeof node.id !== "string" || typeof node.text !== "string" || byId[node.id]) return;
          var kept = { id: node.id, text: node.text };
          if (typeof node.row === "number") kept.row = node.row;
          if (typeof node.versionOf === "string") kept.versionOf = node.versionOf;
          if (node.auto) kept.auto = true;
          byId[node.id] = kept;
          nodes.push(kept);
        });
        var edges = (Array.isArray(raw.edges) ? raw.edges : []).filter(function (edge) {
          return Array.isArray(edge) && byId[edge[0]] && byId[edge[1]] && edge[0] !== edge[1];
        }).map(function (edge) { return [edge[0], edge[1]]; });
        var roots = (Array.isArray(raw.roots) ? raw.roots : []).filter(function (id) { return byId[id]; });

      }

      // Filled in below, once commit()/openModal() exist. The forest module calls
      // these by reference at tap time, so it doesn't need to know about them yet.
      var interactions = {};

      /* ---------- tap detection ---------- */
      // Distinguishes a tap from the start of a drag or pan: it only fires if
      // the pointer stays within a few pixels of where it went down and is
      // released quickly. It's cancelled the moment the pointer moves past the
      // threshold, at which point d3's own drag (on nodes) or zoom (for
      // panning) takes over as normal -- this runs alongside those, not in
      // place of them, and works the same for mouse, pen and touch.
      var tapState = new Map();
      var TAP_PX = 6, TAP_MS = 500;
      function addPress(selection, handlers) {
        selection
          .on("pointerdown.tap", function (e) {
            // For a touch pointer specifically, this also suppresses the
            // browser's own "compatibility" mouse events (mousedown/mouseup/
            // click) that would otherwise follow shortly after -- without it,
            // that trailing synthetic click can land on whatever the tap just
            // opened (e.g. the modal backdrop) and immediately close it again.
            // Scoped to touch only: calling this for mouse/pen pointers stops
            // d3's own zoom-pan and node-drag gestures from starting.

            tapState.set(e.pointerId, { x: e.clientX, y: e.clientY, t: Date.now(), moved: false, el: el });
          })
          .on("pointermove.tap", function (e) {
            var s = tapState.get(e.pointerId);
            if (!s || s.moved) return;
            if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > TAP_PX) s.moved = true;
          })
          .on("pointerup.tap", function (e, d) {
            var s = tapState.get(e.pointerId);
            tapState.delete(e.pointerId);
            if (!s) return;
            if (!s.moved && s.el === this && Date.now() - s.t < TAP_MS && handlers.onTap) {

            }

          .on("pointercancel.tap", function (e) {

      }

      /* ---------- forest chart (force-directed) ---------- */
      // If d3 fails to load, the rest of the page still runs but the canvas stays empty.
      var forest = (function () {
        var d3 = window.d3;
        if (!d3) return {
          update: function () {}, fit: function () {},
          canvasPoint: function () { return null; },
          placeNewRoot: function (idea) { roots.push(idea); },
          shownRows: function () { return null; }
        };

        // Layout units: horizontal room per node, vertical distance between levels, top margin.
        var X_GAP = 60, Y_GAP = 80, TOP = 50;

        var pane = document.getElementById("forest-pane");
        var tip = document.getElementById("tip");
        var tipText = document.getElementById("tip-text");
        var tipStatus = document.getElementById("tip-status");
        var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

        var width = pane.clientWidth || 400;
        var height = pane.clientHeight || 400;
        var byId = {};
        var lastTree = [];
        var lastStatus = {};
        var bounds = null;      // extent of the laid-out forest, used to fit it in view
        var userMoved = false;  // once you pan or zoom yourself, auto-fit stops
        var wasEmpty = true;    // any pan/zoom while there was nothing to see shouldn't stick

        var svg = d3.select("#forest");
        var bg = svg.append("rect").attr("class", "bg").attr("width", "100%").attr("height", "100%");
        var viewport = svg.append("g");
        var linkLayer = viewport.append("g");
        var linkFlowLayer = viewport.append("g"); // the "flowing toward parent" overlay, above the edges
        var versionLayer = viewport.append("g");  // ties between versions of the same idea
        var nodeLayer = viewport.append("g");
        var linkSel = linkLayer.selectAll("path");
        var linkFlowSel = linkFlowLayer.selectAll("path");
        var versionSel = versionLayer.selectAll("path");
        var nodeSel = nodeLayer.selectAll("g");

        // Tapping empty space (the background rect, not a node or link) opens the
        // "new idea" form.
        addPress(bg, {
          onTap: function (e) {
            if (interactions.onBackgroundTap) interactions.onBackgroundTap(e);
          }
        });

        function radius(d) { return 10; }

        /* ---------- laying out one tree ---------- */
        // Ideas that are versions of each other (see idea.versionOf) sit side
        // by side as one group, and a criticism that applies to several of
        // them hangs once, between the versions it attacks. Everything below
        // such a group is an ordinary tree again, so the same routine handles
        // both -- a group of one is just a node.
        var LEAF_HALF = X_GAP / 2;     // room a childless idea takes to its own side
        var BLOCK_GAP = 10;            // extra room between two neighbouring subtrees
        var MEMBER_GAP = X_GAP + BLOCK_GAP; // versions sit as close as ordinary siblings do

        // Splits siblings into version groups, keeping the list's own order.
        function groupSiblings(list) {
          var index = {}, groupOf = {}, groups = [];
          list.forEach(function (idea, i) { index[idea.id] = i; });
          list.forEach(function (idea) {
            var base = idea, seen = {};
            while (base.versionOf && index[base.versionOf] !== undefined && !seen[base.id]) {
              seen[base.id] = true;
              base = list[index[base.versionOf]];
            }
            var group = groupOf[base.id];
            if (!group) { group = { members: [] }; groupOf[base.id] = group; groups.push(group); }
            if (group.members.indexOf(idea) === -1) group.members.push(idea);

          groups.forEach(function (group) {
            group.members.sort(function (a, b) { return index[a.id] - index[b.id]; });
          });

        }

        // Lays out a version group and everything under it, in its own
        // coordinates: every idea gets an x, and each version sits over the
        // middle of the criticisms it owns -- so ones shared by two versions
        // end up between them, and private ones out on their own side.
        function buildBlock(members) {
          var union = [], seen = {};
          members.forEach(function (member) {
            member.children.forEach(function (child) {
              if (!seen[child.id]) { seen[child.id] = true; union.push(child); }
            });
          });
          // An idea that is somehow both a version and a criticism of the same
          // idea would otherwise be laid out inside itself.
          var childGroups = groupSiblings(union).filter(function (group) {
            return !group.members.some(function (child) { return members.indexOf(child) !== -1; });
          });
          childGroups.forEach(function (group) {
            group.owners = [];
            members.forEach(function (member, i) {
              var owns = group.members.some(function (child) { return member.children.indexOf(child) !== -1; });
              if (owns) group.owners.push(i);
            });
            if (!group.owners.length) group.owners.push(0);
            group.anchor = group.owners.reduce(function (a, b) { return a + b; }, 0) / group.owners.length;
          });
          // Shared criticisms belong between the versions that share them.
          childGroups.sort(function (a, b) { return a.anchor - b.anchor; });

          var pos = {}, versionIndex = {}, cursor = 0;
          childGroups.forEach(function (group, i) {
            var block = buildBlock(group.members);
            var shift = (i === 0 ? 0 : cursor + BLOCK_GAP) - block.min;
            Object.keys(block.pos).forEach(function (id) { pos[id] = block.pos[id] + shift; });
            Object.keys(block.versionIndex).forEach(function (id) { versionIndex[id] = block.versionIndex[id]; });
            group.center = block.memberXs.reduce(function (a, b) { return a + b; }, 0) / block.memberXs.length + shift;
            cursor = block.max + shift;
          });

          var memberXs = members.map(function (member, i) {
            var owned = childGroups.filter(function (group) { return group.owners.indexOf(i) !== -1; });
            if (!owned.length) return null;
            return owned.reduce(function (a, group) { return a + group.center; }, 0) / owned.length;
          });
          for (var i = 0; i < memberXs.length; i++) {
            if (memberXs[i] === null) {
              memberXs[i] = i === 0 ? (childGroups.length ? childGroups[0].center : 0) : memberXs[i - 1] + MEMBER_GAP;
            }
            if (i > 0 && memberXs[i] < memberXs[i - 1] + MEMBER_GAP) memberXs[i] = memberXs[i - 1] + MEMBER_GAP;
          }
          members.forEach(function (member, i) {
            pos[member.id] = memberXs[i];
            versionIndex[member.id] = i;
          });

          var xs = Object.keys(pos).map(function (id) { return pos[id]; });
          return {
            pos: pos,
            versionIndex: versionIndex,
            memberXs: memberXs,
            min: Math.min.apply(null, xs) - LEAF_HALF,
            max: Math.max.apply(null, xs) + LEAF_HALF
          };
        }

        /* ---------- rows of trees ---------- */
        // Trees are laid out like words in a paragraph: in their top-level
        // order, left to right, wrapping into rows. Each point in history
        // saves which row every tree was in (idea.row) along with rowsMeta
        // (whether you arranged them yourself, and at what pane size), so
        // what's shown depends only on that saved state and the current
        // pane -- never on how you got there. Saved rows are shown as long
        // as they still fit the pane reasonably well; otherwise the trees
        // are rebalanced for the current pane.
        var TREE_GAP_X = 2.2 * X_GAP; // same room between trees as before
        var ROW_GAP_Y = 100;          // room for one row's previews and the next row's titles
        var rowOf = {};               // tree (root idea id) -> row shown in the last layout
        var shownManual = false;      // whether the rows shown are ones you arranged yourself
        var layoutRows = [];          // [{ ids, top, bottom }] from the last layout, for drops
        var groupMembers = {};        // first version's id -> every version's id, in order
        var groupLeader = {};         // any version's id -> the id its group is listed under

        // Width of blocks[from..to), including the gaps between them.
        function rowWidth(blocks, from, to) {
          var w = 0;
          for (var i = from; i < to; i++) w += blocks[i].w;
          return w + TREE_GAP_X * (to - from - 1);
        }

        // How far fit() could zoom in on a given split into rows (bigger is
        // better), plus how far the result's shape is from the pane's own
        // (0 = same proportions) -- the tie-breaker once several splits all
        // reach fit()'s maximum zoom.
        function rowsFit(blocks, counts) {
          var i = 0, maxW = 0, totalH = 0;
          counts.forEach(function (c, r) {
            maxW = Math.max(maxW, rowWidth(blocks, i, i + c));
            var h = 0;
            for (var j = i; j < i + c; j++) h = Math.max(h, blocks[j].h);
            totalH += h + (r > 0 ? ROW_GAP_Y : 0);
            i += c;
          });
          var w = maxW + 160, h2 = totalH + 130;
          return {
            scale: Math.min(1.6, width / w, height / h2),
            mismatch: Math.abs(Math.log((w / h2) / (width / height)))
          };
        }
        function rowsScale(blocks, counts) { return rowsFit(blocks, counts).scale; }

        // The most even split of the trees, in order, into k rows (keeps the
        // widest row as narrow as possible). Returns how many trees per row.
        function balancedCounts(blocks, k) {
          var n = blocks.length, cost = [], cut = [], i, j, p;
          for (j = 0; j <= k; j++) {
            cost.push([]); cut.push([]);
            for (i = 0; i <= n; i++) { cost[j].push(Infinity); cut[j].push(0); }
          }
          cost[0][0] = 0;
          for (j = 1; j <= k; j++) {
            for (i = j; i <= n; i++) {
              for (p = j - 1; p < i; p++) {
                var c = Math.max(cost[j - 1][p], rowWidth(blocks, p, i));
                if (c < cost[j][i]) { cost[j][i] = c; cut[j][i] = p; }
              }
            }
          }
          var counts = [], end = n;
          for (j = k; j >= 1; j--) { counts.unshift(end - cut[j][end]); end = cut[j][end]; }
          return counts;
        }

        // Picks trees-per-row for this render.
        function chooseRows(blocks) {
          // Biggest zoom wins; among splits that zoom about as far (e.g. all
          // at fit()'s maximum), the one shaped most like the pane wins, so a
          // few small trees don't sit in one strip with the rest of the pane
          // empty.
          var best = null, bestScale = -1, bestMismatch = Infinity;
          for (var k = 1; k <= blocks.length; k++) {
            var counts = balancedCounts(blocks, k);
            var f = rowsFit(blocks, counts);
            if (f.scale > bestScale * 1.02 ||
                (f.scale >= bestScale * 0.98 && f.mismatch < bestMismatch)) {
              best = counts;
              bestScale = Math.max(bestScale, f.scale);
              bestMismatch = f.mismatch;
            }
          }

          // The rows saved with this point in history, if any: a tree
          // without a saved row joins the row of the tree before it, and rows
          // have to read in order.
          var saved = [], lastRow = -1, anySaved = false;
          for (var i = 0; i < blocks.length; i++) {
            var r = blocks[i].idea.row;
            if (typeof r === "number") anySaved = true;
            else r = Math.max(lastRow, 0);
            if (r < lastRow) { saved = null; break; }
            if (r > lastRow) { saved.push(0); lastRow = r; }
            saved[saved.length - 1] += 1;
          }
          if (!saved || !anySaved) { shownManual = false; return best; }

          // Rows you arranged yourself are shown as-is while the pane is
          // about the size it was then; otherwise saved rows are shown only
          // while they're not noticeably worse than the best fit.
          var meta = rowsMeta || {};
          var sameSize = meta.w > 0 && meta.h > 0 &&
            Math.abs(width - meta.w) <= meta.w * 0.2 &&
            Math.abs(height - meta.h) <= meta.h * 0.2;
          if ((meta.manual && sameSize) || rowsScale(blocks, saved) >= bestScale * 0.85) {
            shownManual = !!meta.manual;
            return saved;
          }
          shownManual = false;
          return best;
        }

        // Rows you've just arranged (by dragging a tree, or tapping to add one
        // at a spot): saved onto the ideas themselves -- marked as yours if
        // `manual`, or else just recording the rows as currently shown.
        function setManualRows(rowsIds, manual) {
          var byIdea = {};
          roots.forEach(function (idea) { byIdea[idea.id] = idea; });
          roots.forEach(function (idea) { delete idea.row; });

        // Redraws the chart from the idea tree. Nodes are matched by idea id, so

            .data(links, function (d) { return d.source.id + ">" + d.target.id; })
