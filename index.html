<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Layout Example</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .left, .right {
      flex: 1;
      padding: 2rem;
      box-sizing: border-box;
    }
    .left {
      background: #f0f0f0;
      border-right: 2px solid #ddd;
    }
    .right {
      background: #fff;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }
      .left, .right {
        border-right: none;
        border-bottom: 2px solid #ddd;
      }
      .right {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h2>Left Side</h2>
      <form>
        <label for="user-text">Enter text:</label><br>
        <textarea id="user-text" name="user-text" rows="6" style="width:100%;"></textarea><br>
        <button type="submit" style="margin-top:8px;">Submit</button>
      </form>
    </div>
    <div class="right">
      <h2>Right Side</h2>
      <canvas id="graph-canvas" style="width: 100%; height: 400px; background: #e9f5ff; border: 2px dashed #99c2e6; display: block;"></canvas>
    </div>
  </div>
<script>
// --- Idea list and drawing logic ---
let ideas = [];

const form = document.querySelector('form');
const textarea = document.getElementById('user-text');
const canvas = document.getElementById('graph-canvas');

function resizeCanvas() {
  // Set actual internal size for crisp rendering.
  const cssWidth = canvas.offsetWidth;
  const cssHeight = canvas.offsetHeight;
  canvas.width = cssWidth;
  canvas.height = cssHeight;
}

function drawCircles() {
  resizeCanvas();
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (ideas.length === 0) {
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#579';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Graph will appear here', canvas.width/2, canvas.height/2);
    return;
  }

  // Draw circles for each idea, spaced horizontally
  const total = ideas.length;
  const radius = 40;
  const padding = 30;
  const totalWidth = total * (radius*2 + padding) - padding;
  let startX = (canvas.width - totalWidth) / 2 + radius;
  const centerY = canvas.height / 2;
  
  for (let i = 0; i < total; i++) {
    const x = startX + i * (radius*2 + padding);
    ctx.beginPath();
    ctx.arc(x, centerY, radius, 0, 2 * Math.PI, false);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#99c2e6';
    ctx.lineWidth = 4;
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#579';
    ctx.fillText(String(ideas[i].id), x, centerY);
  }
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const ideaText = textarea.value.trim();
  if (!ideaText) return;
  ideas.push({ id: ideas.length+1, text: ideaText });
  textarea.value = '';
  drawCircles();
});

window.addEventListener('resize', drawCircles);
drawCircles();
</script>
</body>
</html>
